function csv(t){const rows=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
const hasF=()=>Object.values(st.fac).some(l=>l.on);
const pts=()=>Object.values(st.fac).filter(l=>l.on).map(l=>`<g fill="${l.c}" fill-opacity=".85" stroke="#fff" stroke-width=".5" style="pointer-events:none">`+l.p.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('')+'</g>').join('');
document.addEventListener('DOMContentLoaded',()=>{$('file').onchange=async e=>{let ok=0,bad=0,msg='';for(const f of e.target.files){let t=await f.text();if(t.charCodeAt(0)==65279)t=t.slice(1);const base=f.name.replace(/\.\w+$/,'').replace(/[_-]/g,' ');try{if(t.trim()[0]=='{'||t.trim()[0]=='['){const j=JSON.parse(t);(j.features||[]).forEach(ft=>{const g=ft.geometry,p=ft.properties||{};if(!g||g.type!='Point')return;const k=Object.keys(p).find(k=>TY.test(k));addPt(k&&p[k]?String(p[k]):base,g.coordinates[1],g.coordinates[0])?ok++:bad++})}else{const R=csv(t),h=R[0].map(x=>x.trim()),ia=h.findIndex(x=>/^(lat|latitude|y)$/i.test(x)),io=h.findIndex(x=>/^(lon|lng|long|longitude|x)$/i.test(x)),it=h.findIndex(x=>TY.test(x));if(ia<0||io<0){msg+=f.name+': no latitude/longitude columns found. ';continue}R.slice(1).forEach(r=>{addPt(it>=0&&r[it]?r[it].trim():base,+r[ia],+r[io])?ok++:bad++})}}catch(x){msg+=f.name+': could not read this file. '}}e.target.value='';$('fn').textContent=msg+ok+' facilities plotted'+(bad?', '+bad+' skipped (missing or outside New Jersey)':'')+'.';draw()}});
const OUT=[[-74.69,41.36],[-74.26,41.15],[-73.90,40.99],[-74.02,40.70],[-74.20,40.50],[-74.00,40.46],[-73.99,40.30],[-74.10,39.76],[-74.40,39.36],[-74.90,38.93],[-75.05,39.20],[-75.40,39.40],[-75.55,39.60],[-75.40,39.80],[-75.10,39.95],[-74.77,40.22],[-75.04,40.37],[-75.19,40.69],[-75.13,40.97]];

const PX=(lo,la)=>[Math.round((lo+75.7)*276),Math.round((41.5-la)*360)];
function geoSvg(R,v,mn,mx){const path=OUT.map(p=>PX(p[0],p[1]).join(",")).join(" ");
 const items=R.map((r,i)=>[r,v[i],PX(LL[r][1],LL[r][0])]).sort((a,b)=>b[1]-a[1]);
 return `<svg viewBox="0 0 500 940" style="width:100%;max-height:680px" role="group" aria-label="New Jersey county map">${hasF()?'':`<polygon points="${path}" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>`}<text x="470" y="700" text-anchor="end" fill="var(--mut)" font-size="13">Atlantic Ocean</text><text x="20" y="130" fill="var(--mut)" font-size="13">Pennsylvania</text><text x="380" y="40" fill="var(--mut)" font-size="13">New York</text>`+items.map(([r,x,p])=>{const t=(x-mn)/(mx-mn||1),rad=9+22*Math.sqrt(t),col=ramp(t);return `<g data-r="${r}" style="cursor:pointer"><title>${r}: ${fmt(x)}${unit()}</title><circle cx="${p[0]}" cy="${p[1]}" r="${rad.toFixed(1)}" fill="${col}" fill-opacity="${hasF()?.25:.88}" stroke="${r==st.sel?"var(--ink)":"var(--surf)"}" stroke-width="${r==st.sel?4:1.5}"/><text x="${p[0]}" y="${p[1]+rad+13}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">${r}</text></g>`}).join("")+pts()+"</svg>"}
function draw(){
 const R=regs(),v=R.map(r=>val(r,st.y)),mn=Math.min(...v),mx=Math.max(...v);if(!R.includes(st.sel))st.sel=R[v.indexOf(mx)];
 $("yl").textContent=YRS[st.y];$("mt").textContent=MT[st.m]+", "+YRS[st.y];$("lo").textContent=fmt(mn);$("hi").textContent=fmt(mx);
 $("ramp").style.background="linear-gradient(90deg,"+RAMP.join(",")+")";
 const L=st.s=="nj"?NJ:WL,cols=st.s=="nj"?5:8,m=$("map");m.style.gridTemplateColumns="repeat(" + cols + ",1fr)";
 const geoOn=st.s=="nj"&&st.v=="geo";m.style.display=geoOn?"block":"grid";m.innerHTML=geoOn?geoSvg(R,v,mn,mx):R.map((r,i)=>{const col=ramp((v[i]-mn)/(mx-mn||1)),x=st.s=="nj"?L[r][1]:L[r][0],y=st.s=="nj"?L[r][2]:L[r][1];
  return `<button class="tile" data-r="${r}" aria-pressed="${r==st.sel}" style="grid-column:${x+1};grid-row:${y+1};background:${col};color:${lum(col)<140?"#fff":"#1b2a24"}"><span>${r}</span><i>${fmt(v[i])}</i></button>`}).join("");
 const ord=R.map((r,i)=>[r,v[i]]).sort((a,b)=>b[1]-a[1]);
 $("rk").innerHTML=ord.slice(0,8).map(([r,x])=>`<button class="rank" data-r="${r}"><span>${r}</span><u style="width:${x/mx*100}%;background:${ramp((x-mn)/(mx-mn||1))}"></u><b>${fmt(x)}</b></button>`).join("");
 const r=st.sel,tot=tons(r,st.y),all=CATS.map((_,c)=>cell(r,st.y,c)),sum=all.reduce((a,b)=>a+b)||1,tr=YRS.map((_,y)=>tons(r,y)),tm=Math.max(...tr),tn=Math.min(...tr);
 const pts=tr.map((t,i)=>`${8+i*44},${50-(t-tn)/(tm-tn||1)*40}`).join(" "),chg=(tr[6]-tr[0])/(tr[0]||1)*100;
 $("det").innerHTML=`<h2>${r}${st.s=="nj"?" County":""}</h2><div class="big">${fmt(tot)} <small style="font-size:18px;font-weight:600">tons</small></div><p class="sub" style="margin-top:4px">≈ ${fmt(tot*1000*1.85)} meals thrown out · ${fmt(tot*1.6/1e3)} $M est. cost · rank ${ord.findIndex(o=>o[0]==r)+1} of ${R.length}</p>
 <div class="stack">${all.map((x,c)=>`<div title="${CATS[c]}" style="flex:${x};background:${COL[c]}"></div>`).join("")}</div><div class="kv">${all.map((x,c)=>st.cats.has(c)||1?`<span style="--c:${COL[c]}">${CATS[c]} ${Math.round(x/sum*100)}%</span>`:"").join("")}</div>
 <h2 style="margin-top:18px">2018–2024 trend (${chg>=0?"+":""}${chg.toFixed(0)}%)</h2><svg viewBox="0 0 312 58" width="100%" role="img" aria-label="Trend"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>${tr.map((t,i)=>`<circle cx="${8+i*44}" cy="${50-(t-tn)/(tm-tn||1)*40}" r="${i==st.y?5:2.5}" fill="${i==st.y?"var(--acc)":"var(--surf)"}" stroke="var(--acc)" stroke-width="1.5"/>`).join("")}</svg>`;
 const T=R.reduce((s,q)=>s+tons(q,st.y),0),k=+$("red").value/100;$("rv").textContent=Math.round(k*100)+"%";
 $("wi").innerHTML=`<div><b>${fmt(T*k)}</b><small>tons kept out of bins</small></div><div><b>${fmt(T*k*1850)}</b><small>meals saved</small></div><div><b>$${fmt(T*k*1.6/1e3)}M</b><small>est. saved</small></div>`;
 $("logbox").style.display=st.s=="nj"?"":"none";$("vseg").style.display=st.s=="nj"?"":"none";$("fac").style.display=st.s=="nj"?"":"none";$("lay").innerHTML=Object.entries(st.fac).map(([k,l])=>`<button class="chip" style="--c:${l.c}" data-l="${encodeURIComponent(k)}" aria-pressed="${l.on}">${k} ${l.p.length}</button>`).join("");$("ln").textContent=st.logs.length+" saved here";
 $("sub").textContent=st.s=="nj"?"Track food waste across New Jersey’s 21 counties. Bubbles sit at each county’s approximate center. Click one for detail, or switch to Tiles.":"Compare 20 countries from the global dataset. Each tile is a country, placed roughly by geography.";
 $("foot").textContent=st.s=="nj"?"County figures are a modeled baseline (county population × the U.S. per-person rate and category mix from your dataset), not NJDEP county data. The outline is schematic. Statewide context from NJDEP: about 22% of New Jersey’s municipal solid waste is food waste, generation fell 14% from 2017 to 2022, and the goal is a 50% cut by 2030. Logged reports are saved in this browser. Cost uses an assumed $1.60/kg.":"World figures come from your uploaded dataset (5,000 records, 2018–2024). Cost uses an assumed $1.60/kg.";
}
$("chips").innerHTML=CATS.map((c,i)=>`<button class="chip" style="--c:${COL[i]}" data-c="${i}" aria-pressed="true">${c}</button>`).join("");
$("lr").innerHTML=Object.keys(NJ).sort().map(k=>`<option>${k}</option>`).join("");$("lc").innerHTML=CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join("");
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-r]");if(!b)return;
 if(b.dataset.r){st.sel=b.dataset.r}

 else if(b.dataset.v){st.v=b.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x==b))}
 else if(b.dataset.m){st.m=b.dataset.m;document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x==b))}
 else if(b.dataset.c){const c=+b.dataset.c;if(st.cats.has(c)&&st.cats.size>1)st.cats.delete(c);else st.cats.add(c);b.setAttribute("aria-pressed",st.cats.has(c))}
 else if(b.id=="play"){if(st.timer){clearInterval(st.timer);st.timer=null;b.textContent="Play";return}b.textContent="Pause";st.y=-1;st.timer=setInterval(()=>{st.y++;$("yr").value=st.y;draw();if(st.y>=6){clearInterval(st.timer);st.timer=null;b.textContent="Play"}},900);return}
